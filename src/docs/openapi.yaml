

openapi: 3.0.3

info:
  title: Todo REST API Architecture
  version: 1.1.0
  description: |
    RESTful Todo API developed using Node.js and Express.

    Supports CRUD operations, Todo state filtering,
    input validation, and JSON/CSV responses.

    JWT access-token authentication (15 minutes),
    refresh-token authentication (7 days),
    HTTP-only cookies, logout and API rate limiting.

    Developed for Assignments 4, 5, 6 and 7.

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Authentication
    description: Login, refresh and logout operations

  - name: Todos
    description: Operations for managing Todo items

  - name: General
    description: Server information

security:
  - bearerAuth: []

paths:
  /:
    get:
      security: []
      tags:
        - General
      summary: Check server status
      operationId: getServerStatus
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Todo REST API is running
                
  /login:
    post:
      tags:
        - Authentication
      summary: Login and obtain JWT tokens
      operationId: login
      security: []
      description: |
        Authenticate using the configured username and password.

        Returns a 15-minute access JWT in the JSON response.
        Stores a 7-day refresh JWT in an HTTP-only cookie.

        Rate limit: 5 requests per 15 minutes per IP.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
            example:
              username: student1
              password: YOUR_TEST_PASSWORD

      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: |
                Sets refreshToken as an HTTP-only cookie
                with a seven-day lifetime.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "429":
          $ref: "#/components/responses/TooManyRequests"

  /refresh:
    post:
      tags:
        - Authentication
      summary: Obtain a new access token
      operationId: refreshAccessToken
      security:
        - refreshCookie: []
      description: |
        Uses the valid refreshToken HTTP-only cookie
        to obtain a new 15-minute access JWT.

      responses:
        "200":
          description: New access token generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

        "401":
          $ref: "#/components/responses/Unauthorized"

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout and invalidate refresh token
      operationId: logout
      security: []
      description: |
        Invalidates the refresh token when present
        and clears the refreshToken cookie.

      responses:
        "204":
          description: Logout completed. No response body.
          headers:
            Set-Cookie:
              description: Clears the refreshToken cookie.
              schema:
                type: string

  /todos:
    get:
      tags:
        - Todos
      summary: Get all Todos
      description: |
        Retrieve all Todo items or filter them by state.

        Supports JSON and CSV responses using the
        Accept request header.
      operationId: getTodos

      parameters:
        - name: state
          in: query
          required: false
          description: Filter Todo items by state
          schema:
            type: string
            enum:
              - todo
              - doing
              - done

      responses:
        "200":
          description: Todo items retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoItem"

            text/csv:
              schema:
                type: string
              example: |
                id,title,description,state,dueDate,createdAt,updatedAt
                123,Study REST APIs,Learn Express,doing,,2026-11-24T10:00:00.000Z,2026-11-24T10:00:00.000Z

        "400":
          description: Invalid state filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid state filter

        "406":
          description: Requested response format is not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Not Acceptable

        "401":
          $ref: "#/components/responses/Unauthorized"

        "429":
          $ref: "#/components/responses/TooManyRequests"


    post:
      tags:
        - Todos
      summary: Create a new Todo
      operationId: createTodo

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoInput"
            example:
              title: Study REST APIs
              description: Complete the assignment
              state: todo
              dueDate: "2026-12-10"

      responses:
        "201":
          description: Todo created successfully
          headers:
            Location:
              description: URL of the created Todo
              schema:
                type: string
                example: /todos/123
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"

        "400":
          description: Invalid Todo data or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid state

        
        "401":
          $ref: "#/components/responses/Unauthorized"

        "429":
          $ref: "#/components/responses/TooManyRequests"


  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique UUID of the Todo item
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Todos
      summary: Get a Todo by ID
      operationId: getTodoById

      responses:
        "200":
          description: Todo retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"

        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Todo not found

        "401":
          $ref: "#/components/responses/Unauthorized"

        "429":
          $ref: "#/components/responses/TooManyRequests"


    put:
      tags:
        - Todos
      summary: Update an existing Todo
      description: |
        Update one or more fields of an existing Todo.
        The original ID and createdAt are preserved.
      operationId: updateTodo

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoUpdate"
            example:
              state: doing

      responses:
        "200":
          description: Todo updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"

        "400":
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid state

        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Todo not found

        "401":
          $ref: "#/components/responses/Unauthorized"

        "429":
          $ref: "#/components/responses/TooManyRequests"


    delete:
      tags:
        - Todos
      summary: Delete a Todo
      operationId: deleteTodo

      responses:
        "204":
          description: Todo deleted successfully. No response body.

        "404":
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Todo not found

        "401":
          $ref: "#/components/responses/Unauthorized"

        "429":
          $ref: "#/components/responses/TooManyRequests"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Enter the access JWT returned by POST /login.
        Access tokens expire after 15 minutes.

    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: |
        HTTP-only refresh-token cookie set by POST /login.
        The browser sends the cookie automatically.
        Refresh tokens expire after 7 days.
  
  schemas:

    TodoItem:
      type: object
      description: Complete Todo item returned by the API
      required:
        - id
        - title
        - description
        - state
        - dueDate
        - createdAt
        - updatedAt

      properties:
        id:
          type: string
          format: uuid
          readOnly: true

        title:
          type: string
          minLength: 1
          example: Study REST APIs

        description:
          type: string
          example: Learn Node.js and Express

        state:
          type: string
          enum:
            - todo
            - doing
            - done
          default: todo

        dueDate:
          type: string
          format: date
          nullable: true
          example: "2026-12-10"

        createdAt:
          type: string
          format: date-time
          readOnly: true

        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TodoInput:
      type: object
      required:
        - title
      additionalProperties: false

      properties:
        title:
          type: string
          minLength: 1

        description:
          type: string

        state:
          type: string
          enum:
            - todo
            - doing
            - done
          default: todo

        dueDate:
          type: string
          format: date
          nullable: true

    TodoUpdate:
      type: object
      minProperties: 1
      additionalProperties: false

      properties:
        title:
          type: string
          minLength: 1

        description:
          type: string

        state:
          type: string
          enum:
            - todo
            - doing
            - done

        dueDate:
          type: string
          format: date
          nullable: true

    Error:
      type: object
      required:
        - error

      properties:
        error:
          type: string
          example: Todo not found

    TokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Signed JWT access token
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds
          example: 900

  responses:
    Unauthorized:
      description: Authentication failed or access token missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid or expired access token

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many API requests. Please try again later.

